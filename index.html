<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
</head>
<body>
<title>Situs Kreuztrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Konzept: ruhiges, akademisches Lernwerkzeug – wie eine gut gesetzte Lehrbuchseite.
   Weißes Blatt, feine Linien, Serifen für Inhalte, DPU-Blau als Leitfarbe, Gold nur als schmale Akzentlinie. */
:root{
  --bg:#f4f5f7; --sheet:#ffffff; --line:#dfe3ea; --line-strong:#c7cdd8;
  --navy:#0f2a5a; --navy-2:#24407a; --navy-soft:#eef2f8;
  --gold:#a8873f;
  --text:#18202e; --muted:#5d6779; --faint:#8a93a3;
  --ok:#1d6f47; --ok-soft:#e8f3ec; --bad:#a3271f; --bad-soft:#f8eae8; --warn:#8a5a0b; --warn-soft:#f8f0df;
  --f-serif:"Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-sans:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --pencil:var(--navy); --print:var(--navy); --rule:var(--line); --paper:var(--bg);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1320; --sheet:#141c2c; --line:#263248; --line-strong:#34425c;
  --navy:#a9c0ea; --navy-2:#c4d4f2; --navy-soft:#1b2740; --gold:#d2b26a;
  --text:#e7ebf2; --muted:#a0aabb; --faint:#7d889c;
  --ok:#6cc799; --ok-soft:#16302a; --bad:#f08f86; --bad-soft:#3a1f1e; --warn:#e2b25e; --warn-soft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1320; --sheet:#141c2c; --line:#263248; --line-strong:#34425c;
  --navy:#a9c0ea; --navy-2:#c4d4f2; --navy-soft:#1b2740; --gold:#d2b26a;
  --text:#e7ebf2; --muted:#a0aabb; --faint:#7d889c;
  --ok:#6cc799; --ok-soft:#16302a; --bad:#f08f86; --bad-soft:#3a1f1e; --warn:#e2b25e; --warn-soft:#33291a; color-scheme:dark}

html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:24px 72px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px}

/* Kopf */
.head{display:block;border-top:3px solid var(--navy);border-bottom:1px solid var(--line);overflow:hidden}
.timing{display:none}
.headmain{display:grid;grid-template-columns:1fr auto;gap:16px 28px;padding:20px 22px 0;min-width:0}
.title{display:flex;flex-direction:column;gap:4px;min-width:0}
.logo{height:64px;width:auto;max-width:170px;align-self:flex-start;object-fit:contain;background:#fff;margin-bottom:10px}
.kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.title h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(34px,6vw,44px);line-height:1.05;letter-spacing:-.01em;color:var(--navy)}
.title .sub{font-family:var(--f-serif);font-style:italic;font-size:17px;color:var(--muted)}
.fields{display:grid;grid-template-columns:auto auto;gap:6px 18px;align-self:end;margin:0;font-size:13.5px}
.field{display:contents}
.field span{color:var(--faint);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.field b{font-weight:500;color:var(--text);white-space:nowrap}
.field[style]{display:contents}
.statusbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin:4px -22px 0;padding:10px 22px;background:var(--navy-soft)}
.statusbar::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.statusbar[data-state="ok"]{color:var(--ok)} .statusbar[data-state="ok"]::before{background:var(--ok)}
.statusbar[data-state="bad"]{color:var(--bad);font-weight:600} .statusbar[data-state="bad"]::before{background:var(--bad)}

/* Abschnitte */
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;gap:10px;font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--text);padding-bottom:6px;border-bottom:1px solid var(--line-strong)}
.sechead b{font-family:var(--f-sans);font-weight:500;font-size:12px;color:var(--gold);letter-spacing:.06em;min-width:16px}
.sechead .act{margin-left:auto;font-family:var(--f-sans);font-size:13px;font-weight:400}
.linkish{background:none;border:none;padding:0;font-size:13px;color:var(--navy-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.linkish:hover{text-decoration-color:currentColor}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted);line-height:1.55}

.stats{display:flex;flex-wrap:wrap;gap:0;padding:0}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px 22px;flex:1;min-width:150px}
.stats .stat + .stat{border-left:1px solid var(--line)}
.stat > span:first-child{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--f-serif);font-size:32px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums lining-nums;line-height:1.1}
.num em{font-style:normal;font-family:var(--f-sans);font-size:14px;font-weight:400;color:var(--faint);margin-left:4px}
.num.ok{color:var(--ok)} .num.bad{color:var(--bad)}

.part{display:flex;flex-direction:column}
.part + .part{border-top:1px solid var(--line)}
.parthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 18px 8px}
.parthead h3{font-size:12px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.08em}
.chrow{display:grid;grid-template-columns:20px 1fr auto auto;align-items:center;gap:14px;padding:9px 18px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.parthead + .chrow{border-top:none}
.chrow:hover{background:var(--navy-soft)}
.chrow input{position:absolute;opacity:0;width:1px;height:1px}
.xbox{width:18px;height:18px;border:1.5px solid var(--line-strong);border-radius:3px;display:grid;place-items:center;background:var(--sheet)}
.xbox svg{width:12px;height:12px;opacity:0}
.chrow input:checked + .xbox{background:var(--navy);border-color:var(--navy)}
.chrow input:checked + .xbox svg{opacity:1}
.chrow input:focus-visible + .xbox{outline:2px solid var(--navy-2);outline-offset:2px}
.chname{font-size:15px;min-width:0;overflow-wrap:anywhere}
.tally{display:flex;width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.tally i{display:block;height:100%}
.tally i.g{background:var(--ok)} .tally i.r{background:var(--bad)}
.cnt{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}

.choices{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px}
.choice{display:inline-flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line-strong);border-radius:4px;padding:7px 12px;font-size:14px}
.choice:hover{border-color:var(--navy-2)}
.bub{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.choice[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:500}
.choice[aria-pressed="true"] .bub{border-color:var(--navy)}
.choice[aria-pressed="true"] .bub::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--navy)}
.subhead{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:2px 18px 0}
.choices + .subhead{border-top:1px solid var(--line);padding-top:12px}

.go{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.btn{font-family:var(--f-sans);font-weight:600;font-size:15px;background:var(--navy);color:var(--sheet);border:none;border-radius:4px;padding:11px 20px;border-bottom:2px solid var(--gold)}
.btn:hover:not(:disabled){background:var(--navy-2)}
.btn:disabled{opacity:.4;cursor:default}
.ghost{font-size:14px;background:var(--sheet);border:1px solid var(--line-strong);color:var(--text);border-radius:4px;padding:9px 14px}
.ghost:hover{border-color:var(--navy-2);color:var(--navy)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:3px;padding:0 5px;color:var(--muted)}

/* Frage */
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qtop b{color:var(--navy);font-weight:600}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.track i{position:absolute;left:0;top:0;height:100%;background:var(--navy);transition:width .2s}
.qcard{display:block;padding:0;overflow:hidden}
.qnum{display:flex;align-items:baseline;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--navy-soft)}
.qnum b{font-family:var(--f-serif);font-weight:600;font-size:16px;color:var(--navy)}
.qnum span{order:-1;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.qbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qtext{font-family:var(--f-serif);font-size:20px;line-height:1.5;margin:0;color:var(--text)}
.stmts{margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--line-strong);font-family:var(--f-serif);font-size:17px}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img{border:1px solid var(--line);border-radius:4px;max-height:440px;width:auto;object-fit:contain;background:#fff;cursor:zoom-in}
.fig figcaption{font-size:12.5px;color:var(--muted)}
.missing{font-size:13px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:4px;padding:10px 12px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:11px 14px;width:100%}
.opt:not(:disabled):hover{border-color:var(--navy-2);background:var(--navy-soft)}
.opt:disabled{cursor:default}
.ob{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.ot{font-family:var(--f-serif);font-size:17px;line-height:1.45;padding-top:1px;min-width:0;overflow-wrap:anywhere}
.ot mark{background:none;color:inherit}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ob{border-color:var(--ok);color:var(--ok)}
.opt.picked .ob{background:var(--navy);border-color:var(--navy);color:var(--sheet)}
.opt.picked.correct .ob{background:var(--ok);border-color:var(--ok)}
.opt.picked.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.picked.wrong .ob{background:var(--bad);border-color:var(--bad)}
.opt.dim{opacity:.62}

.verdict{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line-strong);padding:10px 0 10px 14px}
.verdict.ok{border-color:var(--ok)} .verdict.bad{border-color:var(--bad)} .verdict.none{border-color:var(--warn)}
.stamp{font-weight:600;font-size:15px}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)} .stamp.none{color:var(--warn)}
.notes{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55;color:var(--text)}
.notes .warn{color:var(--bad)}
.mine{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--navy-soft);color:var(--navy);border-radius:3px;padding:2px 7px;align-self:flex-start;font-weight:600}
.editor{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line-strong);border-radius:5px;padding:14px;background:var(--bg)}
.editor .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pick{display:flex;gap:8px}
.pick button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--sheet);font-weight:600;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--navy);color:var(--sheet);border-color:var(--navy)}
.editor .subhead{padding:0}
.editor textarea,#codeBox{width:100%;font-family:var(--f-sans);font-size:14px;border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;background:var(--sheet);color:var(--text)}
#codeBox{font-family:var(--f-mono);font-size:12px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

.result{padding:24px 22px;display:flex;flex-direction:column;gap:18px}
.grade{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
.grade .stamp{font-family:var(--f-serif);font-size:56px;line-height:1}
.grade .stat{padding:0;min-width:0}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}

.lightbox{position:fixed;inset:0;background:rgba(8,12,20,.88);display:grid;place-items:center;padding:16px;z-index:10;cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}

@media (max-width:560px){
  .headmain{grid-template-columns:1fr;padding:18px 16px 0}
  .statusbar{margin:4px -16px 0;padding:10px 16px}
  .stats .stat + .stat{border-left:none;border-top:1px solid var(--line)}
  .qbody{padding:16px}
  .qnum{padding:10px 16px}
  .qtext{font-size:18px}
  .chrow{grid-template-columns:20px 1fr auto}
  .tally{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="sheet head" aria-label="Bogenkopf">
    <div class="timing" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="headmain">

      <div class="statusbar" id="sync">Fortschritt wird in diesem Browser gespeichert</div>
    </div>
  </header>
  <main id="view"></main>
</div>

async function initDb(){

function buildPool(){
  let pool=Q.filter(q=>sel.has(q.c));
  if(mode==='open') pool=pool.filter(q=>!progress[q.id]);
  if(mode==='wrong') pool=pool.filter(q=>progress[q.id]&&progress[q.id][1]==='0');
  if(mode==='nosol') pool=pool.filter(q=>!ansOf(q));
  return pool;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startSession(list){
  let pool=Array.isArray(list)?list:buildPool();
  if(mode==='random'||mode==='wrong') pool=shuffle([...pool]);
  if(limit&&!Array.isArray(list)) pool=pool.slice(0,limit);
  session={list:pool.map(q=>q.id),i:0,answers:{}};
  window.scrollTo(0,0); renderQuiz();
}

    const mine=edits[q.id], right=A&&ans===A;
    const kind=!A?'none':right?'ok':'bad';
    const stamp=!A?'Keine gesicherte Lösung hinterlegt':right?'Richtig':`Falsch – richtig ist ${A.toUpperCase()}`;
    h+=`<div class="verdict ${kind}" role="status"><span class="stamp ${kind}">${stamp}</span><div class="notes">`;
    if(mine&&mine.a) h+=`<span class="mine">Deine Lösung</span>`;
    if(!A) h+=`<span>Wenn du die Lösung kennst, kannst du sie eintragen.</span>`;
    if(mine&&mine.a&&q.a&&mine.a!==q.a) h+=`<span>Ursprünglich hinterlegt: ${q.a.toUpperCase()}.</span>`;
    if(mine&&mine.n) h+=`<span><b>Notiz:</b> ${esc(mine.n)}</span>`;
    if(!(mine&&mine.a)){
      if(q.src==='plus') h+=`<span>Lösungsvorschlag – in der Vorlage war keine Lösung markiert.</span>`;
      q.notes.forEach((n,i)=>{ const w=q.src==='korr'&&i===0; h+=`<span class="${w?'warn':''}">${w?'⚠ ':''}${esc(n)}</span>`; });
    }
    h+=`<span><button class="linkish" id="editBtn">✎ ${mine?'Eigene Lösung bearbeiten':(A?'Lösung korrigieren':'Lösung eintragen')}</button></span></div></div>`;
    if(editing===q.id){
      h+=`<div class="editor" role="group" aria-label="Eigene Lösung">
        <span class="subhead" style="padding:0">Richtige Antwort ankreuzen</span>
        <div class="pick">${q.o.map(([l])=>`<button aria-pressed="${editSel===l}" data-pick="${l}">${l.toUpperCase()}</button>`).join('')}</div>
        <label class="subhead" style="padding:0" for="editNote">Notiz (optional, z. B. Quelle)</label>
        <textarea id="editNote" rows="2" placeholder="z. B. laut Prometheus S. 123">${esc((mine&&mine.n)||'')}</textarea>
        <div class="row"><button class="btn" id="editSave" ${editSel?'':'disabled'}>Speichern</button><button class="ghost" id="editCancel">Abbrechen</button>
        ${mine?'<button class="ghost" id="editDel" style="color:var(--bad);border-color:var(--bad)">Eigene Lösung entfernen</button>':''}</div>
      </div>`;
    }
    if(q.img&&!q.pre) h+=figHtml(q,'Erläuterungsbild aus der Vorlage');
  }
  h+=`</div></article>
    <div class="navrow"><button class="ghost" id="quit">Beenden</button>
      <span class="go">${session.i>0?'<button class="ghost" id="back">Zurück</button>':''}
      <button class="btn" id="next">${ans?(session.i+1<session.list.length?'Weiter':'Auswertung'):'Überspringen'}</button></span></div></div>`;
  v.innerHTML=h;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.l));
  const eb=document.getElementById('editBtn');
  if(eb) eb.onclick=()=>{ if(editing===q.id){editing=null;} else {editing=q.id; editSel=(edits[q.id]&&edits[q.id].a)||ansOf(q)||null;} renderQuiz(); if(editing) document.getElementById('editNote')?.scrollIntoView({block:'nearest'}); };
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ editNoteDraft=document.getElementById('editNote').value; editSel=b.dataset.pick; renderQuiz(); const t=document.getElementById('editNote'); if(t) t.value=editNoteDraft; });
  const es=document.getElementById('editSave');
  if(es) es.onclick=()=>{ const n=document.getElementById('editNote').value.trim(); edits[q.id]={a:editSel}; if(n) edits[q.id].n=n; regrade(q.id); editing=null; saveEdits(); persist(); renderQuiz(); };
  const ec=document.getElementById('editCancel'); if(ec) ec.onclick=()=>{editing=null;renderQuiz();};
  const ed=document.getElementById('editDel'); if(ed) ed.onclick=()=>{ delete edits[q.id]; regrade(q.id); editing=null; saveEdits(); persist(); renderQuiz(); };
  v.querySelectorAll('.fig img').forEach(im=>im.onclick=()=>{document.getElementById('lbimg').src=im.src;document.getElementById('lb').hidden=false;});
  document.getElementById('next').onclick=next;
  document.getElementById('quit').onclick=()=>{session.list=session.list.slice(0,session.i+(session.answers[q.id]?1:0));session.i=session.list.length;renderQuiz();};
  const back=document.getElementById('back'); if(back) back.onclick=()=>{editing=null;session.i--;renderQuiz();};
}
function answer(l){
  const q=byId[session.list[session.i]];
  if(session.answers[q.id]) return;
  session.answers[q.id]=l;
  const A=ansOf(q); progress[q.id]=l+(A?(l===A?'1':'0'):'-'); persist();
  renderQuiz();
}
function next(){ editing=null; session.i++; window.scrollTo({top:0}); renderQuiz(); }
function renderResult(){
  const ids=Object.keys(session.answers);
  const graded=ids.filter(id=>ansOf(byId[id]));
  const ok=graded.filter(id=>session.answers[id]===ansOf(byId[id])).length;
  const wrong=graded.filter(id=>session.answers[id]!==ansOf(byId[id]));
  const pct=graded.length?Math.round(ok/graded.length*100):0;
  const kind=pct>=60?'ok':'bad';
  document.getElementById('view').innerHTML=`<section class="sec">
     <div class="sechead">Auswertung</div>
     <div class="sheet result">
       <div class="grade"><span class="stamp ${graded.length?kind:'none'}">${pct}%</span>
         <div class="stat"><span>Richtig</span>${digits(ok,3,'ok')}<span class="fine">von ${graded.length} gewerteten Fragen${ids.length>graded.length?` · ${ids.length-graded.length} ohne Lösung`:''}</span></div></div>
       ${wrong.length?`<div class="fine"><b>Falsch:</b> ${wrong.map(id=>`${esc(CH[byId[id].c].title)} – Frage ${byId[id].n}`).join(' · ')}</div>`:''}
       <div class="go">${wrong.length?'<button class="btn" id="redo">Falsche nochmal kreuzen</button>':''}<button class="ghost" id="home">Zur Übersicht</button></div>
     </div></section>`;
  const r=document.getElementById('redo'); if(r) r.onclick=()=>startSession(wrong.map(id=>byId[id]));
  document.getElementById('home').onclick=()=>{session=null;renderHome();};
}
document.addEventListener('keydown',e=>{
  if(!session||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')) return;
  if(!document.getElementById('lb').hidden){ if(e.key==='Escape') document.getElementById('lb').hidden=true; return; }
  const q=byId[session.list[session.i]]; if(!q) return;
  const k=e.key.toLowerCase(); const map={'1':'a','2':'b','3':'c','4':'d','5':'e','6':'f'};
  const l=map[k]||k;
  if(!session.answers[q.id] && q.o.some(o=>o[0]===l) && l.length===1){ e.preventDefault(); answer(l); }
  else if(e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'&&session.i>0){ editing=null; session.i--; renderQuiz(); }
});
document.getElementById('lb').onclick=()=>{document.getElementById('lb').hidden=true;};
renderHome();
if(!saveLocal()) setSync('Achtung: Dieser Browser speichert nicht (privates Fenster?). Nutze den Sicherungscode.','bad');
initDb();
</script>
